<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PassGene</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>PassGene</h1>
      <button id="theme-toggle" class="theme-btn" title="Toggle theme">
        <svg id="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/>
        </svg>
        <svg id="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="hidden">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
    </header>

    <div class="mode-toggle">
      <button id="mode-password" class="mode-btn active">Password</button>
      <button id="mode-passphrase" class="mode-btn">Passphrase</button>
    </div>

    <main>
      <!-- Password Display -->
      <div class="password-display">
        <span id="password-text">Click Generate to start</span>
        <button id="copy-btn" class="icon-btn" title="Copy to clipboard">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
      </div>
      <div id="copy-toast" class="toast">Copied!</div>

      <!-- Strength Indicator -->
      <div class="strength-section">
        <div class="strength-bar-container">
          <div class="strength-bar" id="strength-bar"></div>
        </div>
        <span id="strength-label">-</span>
      </div>

      <!-- Password Options -->
      <div id="password-options">
        <div class="control-row">
          <label>Length: <strong id="length-value">16</strong></label>
          <input type="range" id="length-slider" min="4" max="64" value="16">
        </div>

        <div class="control-row">
          <label>Count: <strong id="count-value">1</strong></label>
          <input type="range" id="count-slider" min="1" max="10" value="1">
        </div>

        <div class="checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="opt-uppercase" checked>
            <span class="checkmark"></span>
            ABC Uppercase
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="opt-lowercase" checked>
            <span class="checkmark"></span>
            abc Lowercase
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="opt-numbers" checked>
            <span class="checkmark"></span>
            123 Numbers
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="opt-symbols" checked>
            <span class="checkmark"></span>
            #$% Symbols
          </label>
        </div>

        <div class="control-row custom-symbols-row" id="custom-symbols-row">
          <label>Custom symbols:</label>
          <input type="text" id="custom-symbols" placeholder="!@#$%&()_-+=?<>[]{}|~^" spellcheck="false">
        </div>
      </div>

      <!-- Passphrase Options -->
      <div id="passphrase-options" class="hidden">
        <div class="control-row">
          <label>Words: <strong id="word-count-value">5</strong></label>
          <input type="range" id="word-count-slider" min="3" max="10" value="5">
        </div>

        <div class="control-row">
          <label>Separator:</label>
          <div class="separator-buttons">
            <button class="sep-btn active" data-sep="-">-</button>
            <button class="sep-btn" data-sep=".">.</button>
            <button class="sep-btn" data-sep="_">_</button>
            <button class="sep-btn" data-sep=" ">space</button>
          </div>
        </div>

        <div class="checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="opt-capitalize" checked>
            <span class="checkmark"></span>
            Capitalize words
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="opt-include-number" checked>
            <span class="checkmark"></span>
            Include a number
          </label>
        </div>
      </div>

      <!-- Generate Button -->
      <button id="generate-btn">Generate</button>

      <!-- History -->
      <div class="history-section">
        <div class="history-header-row">
          <button id="history-toggle" class="history-header">
            History <span id="history-arrow">&#9662;</span>
          </button>
          <button id="clear-history" class="clear-btn hidden">Clear</button>
        </div>
        <div id="history-list" class="history-list hidden"></div>
      </div>
    </main>
  </div>

  <script src="main.js"></script>
</body>
</html>
