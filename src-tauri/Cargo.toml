[package]
name = "passgene"
version = "2.0.1"
edition = "2021"
authors = ["Muhammad Bakhit"]
description = "A modern password & passphrase generator"

[lib]
name = "passgene_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
